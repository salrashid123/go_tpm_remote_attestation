syntax = "proto3";

package verifier;

option go_package = "github.com/salrashid123/go_tpm_remote_attestation/verifier";

service Verifier {
  rpc OfferPlatformCert (OfferPlatformCertRequest) returns (OfferPlatformCertResponse) { }
  rpc OfferEK (OfferEKRequest) returns (OfferEKResponse) { }
  rpc OfferAK (OfferAKRequest) returns (OfferAKResponse) { }      
  rpc GetMakeCredential (GetMakeCredentialRequest) returns (GetMakeCredentialResponse) { }
  rpc SetActivateCredential (SetActivateCredentialRequest) returns (SetActivateCredentialResponse) { }  
  rpc OfferQuote (OfferQuoteRequest) returns (OfferQuoteResponse) { }
  rpc SetQuote (SetQuoteRequest) returns (SetQuoteResponse) { }   
  rpc SetAttestedKey (SetAttestedKeyRequest) returns (SetAttestedKeyResponse) { }
  rpc GetCertificate (GetCertificateRequest) returns (GetCertificateResponse) { }        
}

message OfferPlatformCertRequest {
  string uid = 1;  
  bytes platformCert = 2;  
}

message OfferPlatformCertResponse {}

message OfferEKRequest {
  string uid = 1;  
  bytes ekCert = 2;  
}

message OfferEKResponse {}

message OfferAKRequest {
  string uid = 1;  
  bytes attestation_parameters = 2;  
}

message OfferAKResponse {}

message GetMakeCredentialRequest {
  string uid = 1;  
}

message GetMakeCredentialResponse {
    bytes encrypted_credentials = 1;  
}

message SetActivateCredentialRequest {
  string uid = 1;
  bytes secret = 2;  
}

message SetActivateCredentialResponse {}

message OfferQuoteRequest {
  string uid = 1;
}

message OfferQuoteResponse {
  bytes nonce = 1;
}

message SetQuoteRequest {
  string uid = 1;
  bytes platform_attestation = 2;
}

message SetQuoteResponse {}


message SetAttestedKeyRequest {
  string uid = 1;
  bytes key = 2;
  bytes keyCertification = 3;
}

message SetAttestedKeyResponse {}

message GetCertificateRequest {
  string uid = 1;
  bytes csr = 2;
}

message GetCertificateResponse {
  bytes certificate = 1;
}
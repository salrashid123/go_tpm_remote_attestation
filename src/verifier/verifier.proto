syntax = "proto3";

package verifier;

option go_package = "github.com/salrashid123/go_tpm_remote_attestation/verifier";

service Verifier {
  rpc GetPlatformCert (GetPlatformCertRequest) returns (GetPlatformCertResponse) { }  
  rpc GetEK (GetEKRequest) returns (GetEKResponse) { }
  rpc GetAK (GetAKRequest) returns (GetAKResponse) { }
  rpc Attest (AttestRequest) returns (AttestResponse) { }
  rpc Quote (QuoteRequest) returns (QuoteResponse) { } 
  rpc GetKey (GetAttestedKeyRequest) returns (GetAttestedKeyResponse) { }   
}

message GetPlatformCertRequest {}

message GetPlatformCertResponse {
  bytes platformCert = 1;
}

message GetEKRequest {}

message GetEKResponse {
  bytes ekPub = 1;
  bytes ekCert = 2;
}

message GetAKRequest {}

message GetAKResponse {
  bytes attestation_parameters = 1;
}

message AttestRequest {
  bytes encryptedCredentials = 1;
}

message AttestResponse {
  bytes secret = 1;
}

message QuoteRequest {
  bytes nonce = 1;
}

message QuoteResponse {
  bytes platformAttestation = 1;
}

enum KeyType {
  TLS = 0;
  Signature = 1;
  Encryption = 2;
  AES = 3;
}  
message GetAttestedKeyRequest {
  string kid = 1;
  KeyType key_type = 2;
}

message GetAttestedKeyResponse {
  bytes key = 1;
  bytes keyCertification = 2;
}